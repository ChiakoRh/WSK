<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSK — ساب تفکیک‌شده WhiteDNS بر اساس کشور</title>
<meta name="description" content="Per-country WhiteDNS subscription links: mihomo, clash, base64, raw.">
<meta name="theme-color" content="#121212">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("wsk-theme") || "dark");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cui/tokens.css">
<link rel="stylesheet" href="cui/components.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root { --font-fa: 'Vazirmatn', 'Geist', Inter, system-ui, sans-serif; }
  body { margin: 0; font-family: 'Geist', 'Vazirmatn', Inter, system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  [lang="fa"] body { font-family: var(--font-fa); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; width: 100%; box-sizing: border-box; }
  .navbar { border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .nav-inner { max-width: 1000px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 18px; letter-spacing: -0.03em; color: var(--fg); text-decoration: none; }
  .brand i { width: 20px; height: 20px; color: var(--text-2); }
  .nav-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
  .iconbtn { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .hero { padding: 36px 0 8px; }
  .hero h1 { font-size: 46px; margin: 18px 0 6px; }
  .hero .lede { color: var(--text-2); font-size: 15.5px; line-height: 1.55; margin: 0 0 14px; max-width: 620px; }
  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 14px; }
  .tab { height: 34px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font: 500 13px 'Geist', var(--font-fa); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease); }
  .tab:hover { background: var(--surface-muted); color: var(--fg); }
  .tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab i { width: 15px; height: 15px; }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap .si { position: absolute; top: 50%; inset-inline-start: 14px; transform: translateY(-50%); color: var(--text-3); width: 16px; height: 16px; pointer-events: none; }
  .search { width: 100%; box-sizing: border-box; height: 42px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--fg); padding: 0 14px 0 40px; font: 400 14px 'Geist', var(--font-fa); }
  [dir="rtl"] .search { padding: 0 40px 0 14px; }
  .search::placeholder { color: var(--text-3); }
  .search:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--border-strong); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding-bottom: 24px; }
  .card { padding: 18px; }
  .card .row1 { display: flex; align-items: center; gap: 10px; }
  .flagimg { width: 40px; height: 30px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-sunk); flex-shrink: 0; }
  .flag-emoji { font-size: 1.7rem; line-height: 1; }
  .name { font-weight: 500; letter-spacing: -0.02em; }
  .ccode { margin-inline-start: auto; }
  .count { font-size: 13px; color: var(--text-2); margin: 8px 0 14px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn { height: 34px; padding: 0 14px; font-size: 13px; }
  .actions .btn i { width: 15px; height: 15px; }
  .status { text-align: center; color: var(--text-2); padding: 40px 10px; font-size: 14px; }
  .status.err { color: var(--danger); }
  .status .btn { margin-top: 12px; }
  .skel-card { padding: 18px; }
  .skel-row { display: flex; align-items: center; gap: 10px; }
  .skel-flag { width: 40px; height: 30px; border-radius: 6px; background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
  .skel-name { height: 14px; width: 90px; border-radius: 6px; background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
  .skel-code { height: 18px; width: 34px; border-radius: var(--r-pill); background: var(--border); margin-inline-start: auto; animation: pulse 1.2s ease-in-out infinite; }
  .skel-count { height: 12px; width: 70px; border-radius: 6px; background: var(--border); margin: 10px 0 14px; animation: pulse 1.2s ease-in-out infinite; }
  .skel-bar { height: 34px; border-radius: var(--r-pill); background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:.18} }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--fg); border: 1px solid var(--border-strong); padding: 10px 18px; border-radius: var(--r-pill); font: 500 13px 'Geist', var(--font-fa); display: none; z-index: 50; align-items: center; gap: 8px; }
  .toast.show { display: inline-flex; }
  .toast i { width: 16px; height: 16px; color: var(--success); }
  footer { margin-top: auto; border-top: 1px solid var(--border); text-align: center; color: var(--text-2); font-size: 13px; padding: 22px 16px; }
  footer a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { border-color: var(--fg); }
  @media (max-width: 640px) { .hero h1 { font-size: 34px; } .wrap, .nav-inner { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="brand rise" href="https://chiakorh.github.io/WSK/"><i data-lucide="satellite"></i><span>WSK</span></a>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="https://github.com/ChiakoRh/WSK" target="_blank" rel="noopener"><i data-lucide="star"></i> <span data-i18n="star">ستاره</span></a>
      <button class="btn btn-secondary iconbtn" id="themebtn" title="theme" aria-label="theme"><i data-lucide="moon"></i></button>
      <button class="btn btn-secondary iconbtn" id="langbtn" aria-label="language">EN</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <header class="hero">
    <div class="badge rise"><span class="dot"></span>WhiteDNS <span class="sep">·</span> subs</div>
    <h1 class="rise" style="animation-delay:.08s" data-i18n="title">ساب‌های WhiteDNS بر اساس کشور</h1>
    <p class="lede rise" style="animation-delay:.14s" data-i18n="subtitle">لینک مستقیم هر کشور، آماده کپی برای برنامه‌ات</p>
    <div class="meta-row rise" style="animation-delay:.2s">
      <span class="cmd" id="updated"><i data-lucide="clock" style="width:14px;height:14px"></i> …</span>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-tab="mihomo" role="tab"><i data-lucide="server"></i> Mihomo</button>
    <button class="tab" data-tab="clash" role="tab"><i data-lucide="shield"></i> Clash</button>
    <button class="tab" data-tab="base64" role="tab"><i data-lucide="code"></i> Base64</button>
    <button class="tab" data-tab="raw" role="tab"><i data-lucide="file-text"></i> Raw</button>
  </div>

  <div class="search-wrap">
    <i class="si" data-lucide="search"></i>
    <input class="search" id="search" data-i18n-ph="search" placeholder="جستجوی کشور… (مثلا آلمان، Japan، DE)" aria-label="search">
  </div>

  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
</main>

<footer>
  <span data-i18n="credit">ساخته‌شده از روی ساب اصلی</span>
  <a href="https://github.com/iampedii/whitedns-sub" target="_blank" rel="noopener">iampedii/whitedns-sub</a>
  · <a href="https://github.com/WhiteDNS/WhiteVPN" target="_blank" rel="noopener">WhiteVPN</a>
  · <a href="https://github.com/ChiakoRh/WSK" target="_blank" rel="noopener">GitHub</a>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";
const RAW_BASE = "https://raw.githubusercontent.com/ChiakoRh/WSK/main";
const INDEX_URL = RAW_BASE + "/subs/index.json";
const FLAG_CDN = "https://flagcdn.com/w80/";

const FA_NAMES = {AL:"آلبانی",AT:"اتریش",AU:"استرالیا",BR:"برزیل",CA:"کانادا",DE:"آلمان",DK:"دانمارک",EC:"اکوادور",ES:"اسپانیا",FI:"فنلاند",FR:"فرانسه",GB:"انگلیس",GR:"یونان",HK:"هنگ‌کنگ",IE:"ایرلند",IT:"ایتالیا",JP:"ژاپن",KR:"کره جنوبی",KZ:"قزاقستان",LT:"لیتوانی",LV:"لتونی",MY:"مالزی",NL:"هلند",OT:"سایر",PL:"لهستان",PS:"فلسطین",PT:"پرتغال",RO:"رومانی",RU:"روسیه",SE:"سوئد",SG:"سنگاپور",TW:"تایوان",US:"آمریکا",ZA:"آفریقای جنوبی"};
const EN_NAMES = {AL:"Albania",AT:"Austria",AU:"Australia",BR:"Brazil",CA:"Canada",DE:"Germany",DK:"Denmark",EC:"Ecuador",ES:"Spain",FI:"Finland",FR:"France",GB:"United Kingdom",GR:"Greece",HK:"Hong Kong",IE:"Ireland",IT:"Italy",JP:"Japan",KR:"South Korea",KZ:"Kazakhstan",LT:"Lithuania",LV:"Latvia",MY:"Malaysia",NL:"Netherlands",OT:"Other",PL:"Poland",PS:"Palestine",PT:"Portugal",RO:"Romania",RU:"Russia",SE:"Sweden",SG:"Singapore",TW:"Taiwan",US:"United States",ZA:"South Africa"};

const TABS = {
  mihomo:{dir:"mihomo", prefix:"mihomo-", ext:".yaml", countKey:"mihomo_proxies"},
  clash:{dir:"clash", prefix:"clash-", ext:".yaml", countKey:"mihomo_proxies"},
  base64:{dir:"base64", prefix:"base64-", ext:".txt", countKey:"links"},
  raw:{dir:"raw", prefix:"raw-", ext:".txt", countKey:"links"}
};

const I18N = {
  fa:{title:"ساب‌های WhiteDNS بر اساس کشور", subtitle:"لینک مستقیم هر کشور، آماده کپی برای برنامه‌ات",
      search:"جستجوی کشور… (مثلا آلمان، Japan، DE)", copy:'<i data-lucide="copy"></i> کپی لینک', copied:'<i data-lucide="check"></i> کپی شد!', open:'<i data-lucide="external-link"></i> باز کردن',
      star:"ستاره", count:(n,t)=>`${n} ${t==="links"?"لینک":"پروکسی"}`, updated:d=>`آپدیت: ${d}`,
      loadFail:'خطا در خواندن داده‌ها از گیت‌هاب', retry:'تلاش دوباره', noResult:'کشوری پیدا نشد',
      credit:"ساخته‌شده از روی ساب اصلی"},
  en:{title:"WhiteDNS subs by country", subtitle:"Direct link per country, ready to copy into your app",
      search:"Search country… (e.g. Germany, Japan, DE)", copy:'<i data-lucide="copy"></i> Copy link', copied:'<i data-lucide="check"></i> Copied!', open:'<i data-lucide="external-link"></i> Open',
      star:"Star", count:(n,t)=>`${n} ${t==="links"?"links":"proxies"}`, updated:d=>`Updated: ${d}`,
      loadFail:'Failed to load data from GitHub', retry:'Retry', noResult:'No country found',
      credit:"Built from the upstream sub"}
};

let DATA = null, LANG = localStorage.getItem("wsk-lang") || "fa", TAB = "mihomo", QUERY = "";

function icons(){ if(window.lucide) lucide.createIcons(); }

function flagImg(cc){
  if(cc === "OT") return '<span class="flag-emoji">❓</span>';
  if(!/^[A-Z]{2}$/.test(cc)) return '<span class="flag-emoji">🏳️</span>';
  return `<img class="flagimg" src="${FLAG_CDN}${cc.toLowerCase()}.png" alt="${cc}" loading="lazy" onerror="this.remove()">`;
}
function countryName(cc){ return (LANG==="fa"?FA_NAMES:EN_NAMES)[cc] || cc; }
function subUrl(cc){ const t=TABS[TAB]; return `${RAW_BASE}/subs/${t.dir}/${t.prefix}${cc}${t.ext}`; }

function applyTheme(){
  const th = localStorage.getItem("wsk-theme") || "dark";
  document.documentElement.setAttribute("data-theme", th);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", th==="dark" ? "#121212" : "#ffffff");
  document.getElementById("themebtn").innerHTML = th==="dark" ? '<i data-lucide="moon"></i>' : '<i data-lucide="sun"></i>';
  icons();
}
function applyLang(){
  const d = I18N[LANG];
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==="fa"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = d[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder = d[el.dataset.i18nPh]; });
  document.getElementById("langbtn").textContent = LANG==="fa"?"EN":"فا";
  render();
}

function matches(cc){
  if(!QUERY) return true;
  const q = QUERY.toLowerCase();
  return cc.toLowerCase().includes(q) || (FA_NAMES[cc]||"").includes(QUERY) ||
         (EN_NAMES[cc]||"").toLowerCase().includes(q);
}

function render(){
  const d = I18N[LANG], grid = document.getElementById("grid"), status = document.getElementById("status");
  grid.innerHTML = ""; status.innerHTML = ""; status.className = "status";
  if(!DATA) return;
  const t = TABS[TAB];
  const list = Object.keys(DATA.countries).sort().filter(cc=>{
    if((TAB==="base64"||TAB==="raw") && DATA.countries[cc].links===0) return false;
    return matches(cc);
  });
  if(!list.length){ status.textContent = d.noResult; return; }
  list.forEach((cc, i)=>{
    const n = DATA.countries[cc][t.countKey], url = subUrl(cc);
    const card = document.createElement("div");
    card.className = "card rise";
    card.style.animationDelay = (Math.min(i, 12) * 0.04) + "s";
    card.innerHTML =
      `<div class="row1">${flagImg(cc)}`+
      `<span class="name">${countryName(cc)}</span><span class="chip mono ccode">${cc}</span></div>`+
      `<div class="count">${d.count(n, t.countKey)}</div>`+
      `<div class="actions"><button class="btn btn-primary copy">${d.copy}</button>`+
      `<a class="btn btn-secondary open" href="${url}" target="_blank" rel="noopener">${d.open}</a></div>`;
    card.querySelector(".copy").onclick = async function(){
      const btn = this;
      try{ await navigator.clipboard.writeText(url); }
      catch(e){
        const ta = document.createElement("textarea");
        ta.value = url; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
      btn.innerHTML = d.copied;
      const toast = document.getElementById("toast");
      toast.innerHTML = '<i data-lucide="check"></i><span>' + d.copied.replace(/<[^>]*>/g,'').trim() + '</span>';
      toast.classList.add("show");
      icons();
      clearTimeout(toast._t); toast._t = setTimeout(()=>{ toast.classList.remove("show"); btn.innerHTML = d.copy; icons(); }, 1500);
      icons();
    };
    grid.appendChild(card);
  });
  icons();
}

function renderSkeleton(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for(let i=0;i<8;i++){
    const c = document.createElement("div");
    c.className = "card skel-card";
    c.innerHTML = '<div class="skel-row"><div class="skel-flag"></div><div class="skel-name"></div><div class="skel-code"></div></div><div class="skel-count"></div><div class="skel-bar"></div>';
    grid.appendChild(c);
  }
}
async function load(){
  const d = I18N[LANG], status = document.getElementById("status");
  status.innerHTML = ""; status.className = "status";
  renderSkeleton();
  try{
    const r = await fetch(INDEX_URL, {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    const dt = new Date(DATA.updated_at);
    const ds = dt.toLocaleString(LANG==="fa"?"fa-IR":"en-US");
    document.getElementById("updated").innerHTML = '<i data-lucide="clock" style="width:14px;height:14px"></i> ' + d.updated(ds);
    render();
  }catch(e){
    document.getElementById("grid").innerHTML = "";
    status.className = "status err";
    status.innerHTML = `<div>${d.loadFail}</div><button class="btn btn-secondary retry"><i data-lucide="refresh-cw"></i> ${d.retry}</button>`;
    status.querySelector(".retry").onclick = load;
  }
  icons();
}

document.getElementById("tabs").addEventListener("click", ev=>{
  const b = ev.target.closest(".tab"); if(!b) return;
  TAB = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===b));
  render();
});
document.getElementById("search").addEventListener("input", ev=>{ QUERY = ev.target.value.trim(); render(); });
document.getElementById("langbtn").onclick = ()=>{
  LANG = LANG==="fa"?"en":"fa"; localStorage.setItem("wsk-lang", LANG); applyLang(); load();
};
document.getElementById("themebtn").onclick = ()=>{
  const next = (localStorage.getItem("wsk-theme") || "dark")==="dark" ? "light" : "dark";
  localStorage.setItem("wsk-theme", next); applyTheme();
};
applyTheme(); applyLang(); load();
</script>
</body>
</html>
