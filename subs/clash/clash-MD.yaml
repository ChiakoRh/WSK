port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
proxies:
- alpn:
  - h2
  - http/1.1
  client-fingerprint: chrome
  encryption: none
  name: 🇲🇩 | @WhiteDNS | MD3|5.4MB/s|DNSOK|GPT⁺-MD
  network: ws
  port: 443
  server: ap2.directly.chat
  tls: true
  type: vless
  udp: true
  uuid: 2f9107cb-9af0-4c94-a89d-50437218e5fa
  ws-opts:
    headers:
      Host: ''
      User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML,
        like Gecko) Chrome/55.0.2883.87 Safari/537.36
    path: /md/1
  xudp: true
  servername: ap2.directly.chat
proxy-groups:
- name: MD-Auto
  type: url-test
  proxies:
  - 🇲🇩 | @WhiteDNS | MD3|5.4MB/s|DNSOK|GPT⁺-MD
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- MATCH,MD-Auto
